name: AdmissionCalculator
options:
  bundleIdPrefix: com.qyf9794
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AdmissionCalculator:
    type: application
    platform: iOS
    sources:
      - path: AdmissionCalculator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qyf9794.AdmissionCalculator
        PRODUCT_NAME: AdmissionCalculator
        DEVELOPMENT_TEAM: W7ZK75R9AV
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AdmissionCalculator/Info.plist
        REPORT_PROXY_URL: "https://admissirt-proxy-tyciujgowo.cn-beijing.fcapp.run"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Validate Report Proxy URL
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            value="${REPORT_PROXY_URL:-}"
            if [ -z "${value}" ] || [ "${value}" = "\$(REPORT_PROXY_URL)" ]; then
              echo "error: REPORT_PROXY_URL must be set to the HTTPS Aliyun report proxy trigger URL for Release/TestFlight builds." >&2
              echo "error: Example: xcodebuild -project AdmissionCalculator.xcodeproj -scheme AdmissionCalculator -configuration Release REPORT_PROXY_URL=https://your-function-trigger-url archive" >&2
              exit 1
            fi
            case "${value}" in
              https://*) ;;
              *)
                echo "error: REPORT_PROXY_URL must start with https:// for Release/TestFlight builds." >&2
                exit 1
                ;;
            esac
          fi
    dependencies:
      - sdk: StoreKit.framework
  AdmissionCalculatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AdmissionCalculatorTests
    dependencies:
      - target: AdmissionCalculator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qyf9794.AdmissionCalculatorTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: 1
