name: AdmissionCalculator
options:
  bundleIdPrefix: com.qyf9794
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AdmissionCalculator:
    type: application
    platform: iOS
    sources:
      - path: AdmissionCalculator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qyf9794.AdmissionCalculator
        PRODUCT_NAME: AdmissionCalculator
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Admit Chance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: StoreKit.framework
  AdmissionCalculatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AdmissionCalculatorTests
    dependencies:
      - target: AdmissionCalculator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qyf9794.AdmissionCalculatorTests
        GENERATE_INFOPLIST_FILE: YES
